<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>模拟盘 - Delta Quant</title>
    <link rel="stylesheet" href="/static/common.css">
</head>
<body>
    <nav class="nav">
        <div class="nav-brand">Delta Quant <span class="blue" style="font-size:0.75rem;font-weight:400">v9.0</span></div>
        <div class="nav-links">
            <a href="/paper" class="nav-link active">模拟盘</a>
            <a href="/live" class="nav-link">实盘</a>
            <a href="/connect" class="nav-link">接入交易所</a>
        </div>
        <div class="nav-right">
            <span id="mode-badge" class="badge badge-green">PAPER</span>
            <span id="clock" class="muted" style="font-size:0.8rem"></span>
            <button onclick="logout()" class="btn btn-ghost" style="font-size:0.75rem">退出</button>
        </div>
    </nav>

    <div class="container">
        <!-- 行情条 -->
        <div class="card mb-16" style="padding:12px 20px">
            <div class="ticker-row" id="ticker-bar"><span class="gray">加载行情...</span></div>
        </div>

        <!-- 核心指标 -->
        <div class="grid-4 mb-16">
            <div class="card">
                <div class="stat-label">模拟余额</div>
                <div class="stat-value" id="paper-balance">--</div>
                <div class="stat-label" id="paper-profit">利润: --</div>
            </div>
            <div class="card">
                <div class="stat-label">未实现盈亏</div>
                <div class="stat-value" id="paper-pnl">--</div>
                <div class="stat-label" id="pnl-detail">持仓: 0</div>
            </div>
            <div class="card">
                <div class="stat-label">胜率</div>
                <div class="stat-value" id="win-rate">--</div>
                <div class="stat-label" id="trade-count">交易: 0</div>
            </div>
            <div class="card">
                <div class="stat-label">活跃Agent</div>
                <div class="stat-value" id="active-agents">--</div>
                <div class="stat-label" id="agent-detail">运行中: --</div>
            </div>
        </div>

        <div class="grid-2">
            <!-- 左列 -->
            <div>
                <!-- 模拟盘持仓 -->
                <div class="card mb-16">
                    <div class="card-header">
                        模拟盘持仓
                        <span id="position-count" class="badge badge-blue" style="margin-left:auto">0</span>
                    </div>
                    <div style="overflow-x:auto">
                        <table>
                            <thead>
                                <tr>
                                    <th>币对</th><th>方向</th><th>杠杆</th><th>数量</th>
                                    <th>入场价</th><th>标记价</th><th>盈亏</th>
                                </tr>
                            </thead>
                            <tbody id="positions-body">
                                <tr><td colspan="7" class="text-center gray">加载中...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- Agent监控 -->
                <div class="card">
                    <div class="card-header">Agent监控</div>
                    <div id="agent-grid" class="grid-3">加载中...</div>
                </div>
            </div>

            <!-- 右列 -->
            <div>
                <!-- 快速交易 -->
                <div class="card mb-16">
                    <div class="card-header">快速交易 (模拟)</div>
                    <div class="grid-2 mb-16">
                        <div>
                            <label class="gray" style="font-size:0.75rem">币对</label>
                            <select id="t-symbol" class="input">
                                <option>BTC/USDT</option><option>ETH/USDT</option>
                                <option>SOL/USDT</option><option>XRP/USDT</option>
                                <option>DOGE/USDT</option><option>ADA/USDT</option>
                            </select>
                        </div>
                        <div>
                            <label class="gray" style="font-size:0.75rem">方向</label>
                            <select id="t-side" class="input">
                                <option value="buy">做多</option><option value="sell">做空</option>
                            </select>
                        </div>
                    </div>
                    <div class="grid-3 mb-16">
                        <div>
                            <label class="gray" style="font-size:0.75rem">数量</label>
                            <input type="number" id="t-amount" class="input" step="0.001" placeholder="0.001">
                        </div>
                        <div>
                            <label class="gray" style="font-size:0.75rem">杠杆</label>
                            <select id="t-leverage" class="input">
                                <option>5</option><option>10</option><option selected>20</option><option>30</option><option>50</option>
                            </select>
                        </div>
                        <div>
                            <label class="gray" style="font-size:0.75rem">保证金</label>
                            <select id="t-margin" class="input">
                                <option value="cross">全仓</option><option value="isolated">逐仓</option>
                            </select>
                        </div>
                    </div>
                    <button onclick="executeTrade()" class="btn btn-green btn-full btn-lg">执行交易</button>
                    <div id="trade-result" style="margin-top:8px;font-size:0.8rem"></div>
                </div>

                <!-- 最新信号 -->
                <div class="card mb-16">
                    <div class="card-header">最新信号</div>
                    <div id="signals-list" class="gray">暂无信号</div>
                </div>

                <!-- Agent活动 -->
                <div class="card mb-16">
                    <div class="card-header">
                        Agent活动
                        <span id="activity-count" class="badge badge-blue" style="margin-left:auto">0</span>
                    </div>
                    <div id="activity-log" class="scroll-y" style="max-height:300px;overflow-y:auto;font-size:0.8rem">
                        <span class="gray">等待Agent运行...</span>
                    </div>
                </div>

                <!-- 订单记录 -->
                <div class="card">
                    <div class="card-header">
                        订单记录
                        <span id="order-count" class="badge badge-blue" style="margin-left:auto">0</span>
                    </div>
                    <div id="order-list" class="scroll-y" style="max-height:250px;overflow-y:auto;font-size:0.8rem">
                        <span class="gray">暂无订单</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Auth check
        if (!localStorage.getItem('dq_token')) window.location.href = '/login';

        function authHeaders() {
            return { 'Authorization': 'Bearer ' + localStorage.getItem('dq_token') };
        }

        function logout() {
            localStorage.removeItem('dq_token');
            window.location.href = '/login';
        }

        function updateClock() {
            document.getElementById('clock').textContent = new Date().toLocaleTimeString('zh-CN');
        }
        setInterval(updateClock, 1000);
        updateClock();

        function showToast(msg, type = 'success') {
            const existing = document.querySelector('.toast');
            if (existing) existing.remove();
            const div = document.createElement('div');
            div.className = `toast toast-${type}`;
            div.textContent = msg;
            document.body.appendChild(div);
            setTimeout(() => div.remove(), 3000);
        }

        async function apiFetch(url, opts = {}) {
            opts.headers = { ...opts.headers, ...authHeaders() };
            const res = await fetch(url, opts);
            if (res.status === 401) { logout(); return null; }
            return res;
        }

        // 行情
        async function loadTickers() {
            try {
                const res = await apiFetch('/api/tickers');
                const data = await res.json();
                const bar = document.getElementById('ticker-bar');
                const icons = {'BTC/USDT':'₿','ETH/USDT':'Ξ','SOL/USDT':'◎','XRP/USDT':'✕','DOGE/USDT':'Ð','ADA/USDT':'₳','AVAX/USDT':'▲','BNB/USDT':'◆'};
                let html = '';
                for (const [sym, info] of Object.entries(data)) {
                    const short = sym.replace('/USDT','');
                    html += `<div class="ticker-item"><span style="font-size:1.2rem">${icons[sym]||'●'}</span><div><div class="ticker-symbol">${short}</div><div class="ticker-price">$${info.price.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})}</div></div></div>`;
                }
                bar.innerHTML = html || '<span class="gray">暂无行情数据</span>';
            } catch(e) {}
        }

        // 模拟盘统计
        async function loadPaperStats() {
            try {
                const res = await apiFetch('/api/paper-stats');
                const data = await res.json();
                if (data.error) return;
                document.getElementById('paper-balance').textContent = `$${data.balance.toFixed(2)}`;
                const profit = data.profit || 0;
                const profitEl = document.getElementById('paper-profit');
                profitEl.textContent = `利润: ${profit >= 0 ? '+' : ''}$${profit.toFixed(2)}`;
                profitEl.className = `stat-label ${profit >= 0 ? 'green' : 'red'}`;
                const wr = data.win_rate || 0;
                document.getElementById('win-rate').textContent = `${(wr * 100).toFixed(1)}%`;
                document.getElementById('trade-count').textContent = `交易: ${data.total_trades || 0}`;
            } catch(e) {}
        }

        // Agent状态
        async function loadStatus() {
            try {
                const res = await apiFetch('/api/status');
                const data = await res.json();
                const agentDiv = document.getElementById('agent-grid');
                let html = '';
                let running = 0;
                if (data.agents) {
                    for (const [name, info] of Object.entries(data.agents)) {
                        if (info.state === 'running') running++;
                        const badge = info.state === 'running' ? '<span class="badge badge-green">运行</span>'
                            : info.state === 'failed' ? '<span class="badge badge-red">异常</span>'
                            : '<span class="badge badge-yellow">等待</span>';
                        let lastExec = '';
                        if (info.last_execution) {
                            lastExec = new Date(info.last_execution).toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
                        }
                        html += `<div style="display:flex;align-items:center;justify-content:space-between;padding:6px 8px;background:var(--bg-input);border-radius:8px"><div style="display:flex;flex-direction:column"><span style="font-size:0.8rem">${info.name}</span>${lastExec?`<span style="font-size:0.65rem;color:var(--text-gray)">${lastExec}</span>`:''}</div>${badge}</div>`;
                    }
                }
                agentDiv.innerHTML = html || '<span class="gray">无Agent</span>';
                document.getElementById('active-agents').textContent = running;
                document.getElementById('agent-detail').textContent = `运行中: ${running}`;
            } catch(e) {}
        }

        // 模拟盘持仓
        async function loadPositions() {
            try {
                const res = await apiFetch('/api/positions?mode=paper');
                const data = await res.json();
                const tbody = document.getElementById('positions-body');
                let html = '';
                let count = 0;
                const positions = data.paper || [];
                for (const p of positions) {
                    count++;
                    const sideClass = p.side === 'long' ? 'green' : 'red';
                    const pnlClass = p.unrealized_pnl >= 0 ? 'green' : 'red';
                    html += `<tr>
                        <td><strong>${p.symbol}</strong></td>
                        <td class="${sideClass}">${p.side === 'long' ? '多' : '空'}</td>
                        <td>${p.leverage}x</td><td>${p.contracts}</td>
                        <td>$${p.entry_price.toFixed(4)}</td><td>$${p.mark_price.toFixed(4)}</td>
                        <td class="${pnlClass}">${p.unrealized_pnl >= 0 ? '+' : ''}$${p.unrealized_pnl.toFixed(2)}</td>
                    </tr>`;
                }
                if (!html) html = '<tr><td colspan="7" class="text-center gray">暂无持仓</td></tr>';
                tbody.innerHTML = html;
                document.getElementById('position-count').textContent = count;

                // 更新未实现盈亏汇总
                let totalPnl = 0;
                for (const p of positions) totalPnl += p.unrealized_pnl || 0;
                const pnlEl = document.getElementById('paper-pnl');
                pnlEl.textContent = `${totalPnl >= 0 ? '+' : ''}$${totalPnl.toFixed(2)}`;
                pnlEl.className = `stat-value ${totalPnl >= 0 ? 'green' : 'red'}`;
                document.getElementById('pnl-detail').textContent = `持仓: ${count}`;
            } catch(e) {}
        }

        // 信号
        async function loadSignals() {
            try {
                const res = await apiFetch('/api/signals');
                const data = await res.json();
                const div = document.getElementById('signals-list');
                if (!data || data.length === 0) { div.innerHTML = '<span class="gray">暂无活跃信号</span>'; return; }
                let html = '';
                for (const sig of data) {
                    const dirClass = sig.direction === 'long' ? 'green' : sig.direction === 'short' ? 'red' : 'yellow';
                    html += `<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border)"><div><span style="font-weight:600">${sig.symbol||sig.agent}</span><span class="${dirClass}" style="margin-left:8px">${sig.direction||'--'}</span></div><span class="badge badge-blue">${sig.strength||0}%</span></div>`;
                }
                div.innerHTML = html;
            } catch(e) {}
        }

        // Agent活动
        async function loadAgentActivity() {
            try {
                const res = await apiFetch('/api/agent-activity');
                const data = await res.json();
                const div = document.getElementById('activity-log');
                if (!data || data.length === 0) { div.innerHTML = '<span class="gray">等待Agent运行...</span>'; return; }
                document.getElementById('activity-count').textContent = data.length;
                const typeColors = {signal:'#3b82f6',debate:'#8b5cf6',decision:'#f59e0b',risk:'#ef4444',portfolio:'#10b981',order:'#22c55e',error:'#ef4444',whale:'#06b6d4',orderflow:'#6366f1'};
                let html = '';
                for (const item of data) {
                    const color = typeColors[item.type] || '#6b7280';
                    html += `<div style="display:flex;gap:8px;padding:6px 0;border-bottom:1px solid var(--border);align-items:flex-start"><span style="color:var(--text-gray);min-width:55px;flex-shrink:0">${item.time}</span><span style="color:${color};min-width:60px;font-weight:500;flex-shrink:0">${item.agent}</span><span>${item.action}: ${item.detail}</span></div>`;
                }
                div.innerHTML = html;
            } catch(e) {}
        }

        // 订单记录
        async function loadOrderHistory() {
            try {
                const res = await apiFetch('/api/order-history');
                const data = await res.json();
                const div = document.getElementById('order-list');
                if (!data || data.length === 0) { div.innerHTML = '<span class="gray">暂无订单</span>'; return; }
                let html = '';
                let count = 0;
                for (const item of data) {
                    if (item.type === 'paper_stats') {
                        const pnlClass = item.total_pnl >= 0 ? 'green' : 'red';
                        html += `<div style="padding:8px;background:var(--bg-input);border-radius:8px;margin-bottom:8px"><div style="display:flex;justify-content:space-between;margin-bottom:4px"><span class="badge badge-green">模拟盘</span><span>余额: <strong>$${item.balance.toFixed(2)}</strong></span></div><div style="display:flex;justify-content:space-between;font-size:0.75rem;color:var(--text-gray)"><span>盈亏: <span class="${pnlClass}">$${item.total_pnl.toFixed(2)}</span></span><span>胜率: ${(item.win_rate*100).toFixed(1)}%</span><span>交易: ${item.total_trades}</span></div></div>`;
                        continue;
                    }
                    count++;
                    const sideClass = item.side === 'buy' ? 'green' : 'red';
                    html += `<div style="display:flex;gap:8px;padding:6px 0;border-bottom:1px solid var(--border);align-items:center"><span style="color:var(--text-gray);min-width:55px">${item.time}</span><span style="font-weight:500;min-width:80px">${item.symbol}</span><span class="${sideClass}" style="min-width:20px">${item.side==='buy'?'多':'空'}</span><span class="muted">${item.quantity}</span><span class="muted">@ $${item.price.toFixed(2)}</span></div>`;
                }
                document.getElementById('order-count').textContent = count;
                div.innerHTML = html || '<span class="gray">暂无成交</span>';
            } catch(e) {}
        }

        // 交易
        async function executeTrade() {
            const body = {
                symbol: document.getElementById('t-symbol').value,
                side: document.getElementById('t-side').value,
                amount: parseFloat(document.getElementById('t-amount').value),
                leverage: parseInt(document.getElementById('t-leverage').value),
                exchange: 'auto',
                margin_mode: document.getElementById('t-margin').value,
            };
            if (!body.amount || body.amount <= 0) { showToast('请输入有效数量', 'error'); return; }
            document.getElementById('trade-result').innerHTML = '<span class="yellow">执行中...</span>';
            try {
                const res = await apiFetch('/api/trade', { method:'POST', headers:{'Content-Type':'application/json',...authHeaders()}, body:JSON.stringify(body) });
                const data = await res.json();
                if (data.success) {
                    document.getElementById('trade-result').innerHTML = `<span class="green">下单成功! ${data.exchange} ${data.symbol} ${data.side} @ $${data.price}</span>`;
                    showToast(`下单成功: ${data.symbol}`);
                    setTimeout(() => { loadPositions(); loadPaperStats(); }, 1500);
                } else {
                    document.getElementById('trade-result').innerHTML = `<span class="red">失败: ${data.error}</span>`;
                    showToast(data.error, 'error');
                }
            } catch(e) {
                document.getElementById('trade-result').innerHTML = `<span class="red">请求失败: ${e.message}</span>`;
            }
        }

        // 初始化
        loadTickers(); loadPaperStats(); loadStatus(); loadPositions(); loadSignals(); loadAgentActivity(); loadOrderHistory();
        setInterval(loadTickers, 3000);
        setInterval(loadPaperStats, 10000);
        setInterval(loadStatus, 5000);
        setInterval(loadPositions, 5000);
        setInterval(loadSignals, 10000);
        setInterval(loadAgentActivity, 3000);
        setInterval(loadOrderHistory, 5000);
    </script>
</body>
</html>
