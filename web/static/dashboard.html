<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>交易面板 - Delta Quant</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #0f172a; color: #e2e8f0; font-family: 'Segoe UI', sans-serif; }
        .card { background: #1e293b; border-radius: 12px; padding: 24px; }
        .btn-primary { background: #3b82f6; color: white; padding: 10px 20px; border-radius: 8px; cursor: pointer; border: none; }
        .btn-danger { background: #ef4444; color: white; padding: 10px 20px; border-radius: 8px; cursor: pointer; border: none; }
        .btn-success { background: #22c55e; color: white; padding: 10px 20px; border-radius: 8px; cursor: pointer; border: none; }
        .input-field { background: #374151; border: 1px solid #4b5563; border-radius: 8px; padding: 10px 14px; color: white; width: 100%; }
        .input-field:focus { outline: none; border-color: #3b82f6; }
        select.input-field { appearance: none; }
        .status-green { color: #4ade80; }
        .status-red { color: #f87171; }
        .pnl-positive { color: #4ade80; }
        .pnl-negative { color: #f87171; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 10px; text-align: left; border-bottom: 1px solid #374151; }
        th { color: #94a3b8; font-weight: normal; font-size: 0.875rem; }
    </style>
</head>
<body class="min-h-screen p-6">
    <div class="max-w-6xl mx-auto">
        <div class="flex items-center justify-between mb-8">
            <div class="flex items-center gap-4">
                <a href="/" class="text-blue-400 hover:underline">&larr; 返回</a>
                <h1 class="text-2xl font-bold">交易面板</h1>
            </div>
            <button onclick="emergencyClose()" class="btn-danger">
                紧急全平
            </button>
        </div>

        <!-- 账户总览 -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
            <div class="card" id="binance-card">
                <div class="flex items-center gap-2 mb-3">
                    <span class="text-2xl">🟡</span>
                    <span class="text-lg font-semibold">币安</span>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <div class="text-sm text-gray-400">余额</div>
                        <div class="text-2xl font-bold" id="binance-balance">--</div>
                    </div>
                    <div>
                        <div class="text-sm text-gray-400">未实现盈亏</div>
                        <div class="text-2xl font-bold" id="binance-pnl">--</div>
                    </div>
                </div>
            </div>
            <div class="card" id="okx-card">
                <div class="flex items-center gap-2 mb-3">
                    <span class="text-2xl">🔵</span>
                    <span class="text-lg font-semibold">欧易</span>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <div class="text-sm text-gray-400">余额</div>
                        <div class="text-2xl font-bold" id="okx-balance">--</div>
                    </div>
                    <div>
                        <div class="text-sm text-gray-400">未实现盈亏</div>
                        <div class="text-2xl font-bold" id="okx-pnl">--</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 快速交易 -->
        <div class="card mb-6">
            <h2 class="text-xl font-semibold mb-4">快速交易</h2>
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-4">
                <div>
                    <label class="text-sm text-gray-400">币对</label>
                    <select id="trade-symbol" class="input-field">
                        <option>BTC/USDT</option>
                        <option>ETH/USDT</option>
                        <option>SOL/USDT</option>
                        <option>BNB/USDT</option>
                        <option>XRP/USDT</option>
                        <option>DOGE/USDT</option>
                    </select>
                </div>
                <div>
                    <label class="text-sm text-gray-400">方向</label>
                    <select id="trade-side" class="input-field">
                        <option value="buy">做多</option>
                        <option value="sell">做空</option>
                    </select>
                </div>
                <div>
                    <label class="text-sm text-gray-400">杠杆</label>
                    <select id="trade-leverage" class="input-field">
                        <option>5</option>
                        <option>10</option>
                        <option selected>20</option>
                        <option>30</option>
                        <option>50</option>
                    </select>
                </div>
                <div>
                    <label class="text-sm text-gray-400">平台</label>
                    <select id="trade-exchange" class="input-field">
                        <option value="auto">自动选择</option>
                        <option value="binance">币安</option>
                        <option value="okx">欧易</option>
                    </select>
                </div>
            </div>
            <div class="grid grid-cols-2 gap-4 mb-4">
                <div>
                    <label class="text-sm text-gray-400">数量</label>
                    <input type="number" id="trade-amount" class="input-field" step="0.001" placeholder="0.001">
                </div>
                <div>
                    <label class="text-sm text-gray-400">保证金模式</label>
                    <select id="trade-margin" class="input-field">
                        <option value="cross">全仓</option>
                        <option value="isolated">逐仓</option>
                    </select>
                </div>
            </div>
            <button onclick="executeTrade()" class="btn-success w-full text-lg py-3">
                执行交易
            </button>
            <div id="trade-result" class="mt-3 text-sm"></div>
        </div>

        <!-- 当前持仓 -->
        <div class="card">
            <h2 class="text-xl font-semibold mb-4">当前持仓</h2>
            <div id="positions-table">
                <table>
                    <thead>
                        <tr>
                            <th>平台</th>
                            <th>币对</th>
                            <th>方向</th>
                            <th>杠杆</th>
                            <th>数量</th>
                            <th>入场价</th>
                            <th>标记价</th>
                            <th>盈亏</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="positions-body">
                        <tr><td colspan="9" class="text-center text-gray-400">加载中...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        async function loadBalance() {
            try {
                const res = await fetch('/api/balance');
                const data = await res.json();
                if (data.binance) {
                    document.getElementById('binance-balance').textContent = `$${data.binance.total.toFixed(2)}`;
                    const pnl = data.binance.unrealized_pnl;
                    const pnlEl = document.getElementById('binance-pnl');
                    pnlEl.textContent = `${pnl >= 0 ? '+' : ''}$${pnl.toFixed(2)}`;
                    pnlEl.className = `text-2xl font-bold ${pnl >= 0 ? 'pnl-positive' : 'pnl-negative'}`;
                }
                if (data.okx) {
                    document.getElementById('okx-balance').textContent = `$${data.okx.total.toFixed(2)}`;
                    const pnl = data.okx.unrealized_pnl;
                    const pnlEl = document.getElementById('okx-pnl');
                    pnlEl.textContent = `${pnl >= 0 ? '+' : ''}$${pnl.toFixed(2)}`;
                    pnlEl.className = `text-2xl font-bold ${pnl >= 0 ? 'pnl-positive' : 'pnl-negative'}`;
                }
            } catch (e) {}
        }

        async function loadPositions() {
            try {
                const res = await fetch('/api/positions');
                const data = await res.json();
                const tbody = document.getElementById('positions-body');
                let html = '';
                for (const [exchange, positions] of Object.entries(data)) {
                    if (!positions || positions.length === 0) continue;
                    for (const p of positions) {
                        const pnlClass = p.unrealized_pnl >= 0 ? 'pnl-positive' : 'pnl-negative';
                        const pnlStr = `${p.unrealized_pnl >= 0 ? '+' : ''}$${p.unrealized_pnl.toFixed(2)}`;
                        const label = exchange === 'binance' ? '币安' : exchange === 'okx' ? '欧易' : '模拟盘';
                        html += `
                            <tr>
                                <td>${label}</td>
                                <td>${p.symbol}</td>
                                <td>${p.side === 'long' ? '多' : '空'}</td>
                                <td>${p.leverage}x</td>
                                <td>${p.contracts}</td>
                                <td>$${p.entry_price.toFixed(2)}</td>
                                <td>$${p.mark_price.toFixed(2)}</td>
                                <td class="${pnlClass}">${pnlStr}</td>
                                <td><button onclick="closePosition('${exchange}','${p.symbol}')" class="btn-danger text-sm py-1 px-3">平仓</button></td>
                            </tr>`;
                    }
                }
                if (!html) {
                    html = '<tr><td colspan="9" class="text-center text-gray-400">暂无持仓</td></tr>';
                }
                tbody.innerHTML = html;
            } catch (e) {
                document.getElementById('positions-body').innerHTML =
                    '<tr><td colspan="9" class="text-center text-gray-400">加载失败</td></tr>';
            }
        }

        async function executeTrade() {
            const body = {
                symbol: document.getElementById('trade-symbol').value,
                side: document.getElementById('trade-side').value,
                amount: parseFloat(document.getElementById('trade-amount').value),
                leverage: parseInt(document.getElementById('trade-leverage').value),
                exchange: document.getElementById('trade-exchange').value,
                margin_mode: document.getElementById('trade-margin').value,
            };

            if (!body.amount || body.amount <= 0) {
                document.getElementById('trade-result').innerHTML =
                    '<span class="status-red">请输入有效数量</span>';
                return;
            }

            document.getElementById('trade-result').innerHTML =
                '<span class="text-yellow-400">执行中...</span>';

            try {
                const res = await fetch('/api/trade', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body),
                });
                const data = await res.json();
                if (data.success) {
                    document.getElementById('trade-result').innerHTML =
                        `<span class="status-green">下单成功! 订单ID: ${data.order_id} (${data.exchange})</span>`;
                    setTimeout(() => { loadPositions(); loadBalance(); }, 1000);
                } else {
                    document.getElementById('trade-result').innerHTML =
                        `<span class="status-red">下单失败: ${data.error}</span>`;
                }
            } catch (e) {
                document.getElementById('trade-result').innerHTML =
                    `<span class="status-red">请求失败: ${e.message}</span>`;
            }
        }

        async function closePosition(exchange, symbol) {
            if (!confirm(`确认平仓 ${symbol}?`)) return;
            // 通过紧急全平API的简化版本
            try {
                const res = await fetch('/api/emergency-close', { method: 'POST' });
                const data = await res.json();
                alert(`平仓结果: ${JSON.stringify(data.results)}`);
                setTimeout(loadPositions, 1000);
            } catch (e) {
                alert(`平仓失败: ${e.message}`);
            }
        }

        async function emergencyClose() {
            if (!confirm('确认紧急全平所有持仓? 此操作不可撤销!')) return;
            try {
                const res = await fetch('/api/emergency-close', { method: 'POST' });
                const data = await res.json();
                alert(`紧急全平完成: ${JSON.stringify(data.results)}`);
                setTimeout(() => { loadPositions(); loadBalance(); }, 1000);
            } catch (e) {
                alert(`紧急全平失败: ${e.message}`);
            }
        }

        loadBalance();
        loadPositions();
        setInterval(loadBalance, 10000);
        setInterval(loadPositions, 5000);
    </script>
</body>
</html>
